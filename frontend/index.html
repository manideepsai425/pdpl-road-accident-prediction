<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-Based Road Accident Prediction System — Peddapalli District, Telangana" />
    <title>RoadSafe AI — Peddapalli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg-primary:    #000000;
        --bg-secondary:  #0a0a0a;
        --bg-card:       #111111;
        --bg-card-hover: #161616;
        --bg-elevated:   #1c1c1e;
        --border:        rgba(255,255,255,0.08);
        --border-hover:  rgba(255,255,255,0.16);
        --text-primary:  #ffffff;
        --text-secondary:rgba(255,255,255,0.55);
        --text-tertiary: rgba(255,255,255,0.30);
        --accent-red:    #FF3B30;
        --accent-orange: #FF9500;
        --accent-yellow: #FFCC00;
        --accent-green:  #34C759;
        --accent-blue:   #0A84FF;
        --accent-purple: #BF5AF2;
        --radius-sm: 10px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --radius-xl: 32px;
      }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #root { min-height: 100vh; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
      ::selection { background: rgba(10,132,255,0.3); }
      .leaflet-container { background: #0a0a0a !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
